<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Translator</title>
    <meta name="description" content="SAPUI5 Language Translator powered by Google Cloud Translation API" />

    <style>
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background: #f7f7f7;
        }
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; background: #f7f7f7; z-index: 9999;
            color: #32363a;
        }
        #splashScreen .spinner {
            width: 44px; height: 44px; margin: 16px auto;
            border: 4px solid #e5e5e5; border-top-color: #0a6ed1;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- SAPUI5 Bootstrap from official SAP CDN -->
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-resourceroots='{ "datanub.translator": "./" }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ui/core/ComponentContainer"
            ], function (ComponentContainer) {

                new ComponentContainer({
                    name: "datanub.translator",
                    async: true,
                    height: "100%",
                    componentCreated: function () {
                        var oSplash = document.getElementById("splashScreen");
                        if (oSplash) { oSplash.style.display = "none"; }
                    },
                    componentFailed: function (oEvent) {
                        var sReason = oEvent.getParameter("reason") || "Unknown error";
                        var oSplash = document.getElementById("splashScreen");
                        if (oSplash) {
                            oSplash.innerHTML =
                                "<h2 style='color:#bb0000'>Failed to load application</h2>" +
                                "<p>" + sReason + "</p>" +
                                "<p>Check the browser console for details.</p>";
                        }
                        console.error("Component failed:", sReason);
                    }
                }).placeAt("content");

            });
        });
    </script>
</head>
<body class="sapUiBody">
    <div id="splashScreen">
        <div class="spinner"></div>
        <p>Loading Language Translator&hellip;</p>
    </div>
    <div id="content" style="height: 100%;"></div>
</body>
</html>
